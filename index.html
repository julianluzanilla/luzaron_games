<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Luzaron Games</title>

    <meta
      name="description"
      content="Juegos mentales para toda la familia, sin anuncios y sin internet: Queens, Sudoku, Wordle, Mahjong Solitario y Zip."
    />
    <meta name="theme-color" content="#201e1d" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Tema antes de pintar. Sin esto la app abre en claro un instante y luego
      salta a oscuro: un destello blanco en la cara a las once de la noche.
      Tiene que ir en línea y antes del CSS; las llaves son las mismas que usa
      src/shell/theme.ts.
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('luzaron-theme-v1')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'

          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]').content =
            theme === 'light' ? '#f3f2f2' : '#201e1d'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
