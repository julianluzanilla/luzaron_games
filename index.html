    <meta
      name="description"
      content="Juegos mentales para toda la familia, sin anuncios y sin internet: Queens, Sudoku, Wordle, Mahjong Solitario y Zip."
    />
    <meta name="theme-color" content="#201e1d" />
    <!-- iOS solo usa apple-touch-startup-image con esta meta. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- Archivo va autohospedada (src/style.css → public/fonts): funciona sin internet. -->

      rel="preload"
      href="/fonts/archivo-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

      as="font"
      type="font/woff2"
      crossorigin

    <!--
      Tema antes de pintar. Sin esto la app abre en claro un instante y luego
      salta a oscuro: un destello blanco en la cara a las once de la noche.
      Tiene que ir en línea y antes del CSS; las llaves son las mismas que usa
      src/shell/theme.ts.
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('luzaron-theme-v1')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'

          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]').content =
            theme === 'light' ? '#f3f2f2' : '#201e1d'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>

    <style>
      @font-face { font-family: 'Archivo'; font-weight: 600; font-display: block; src: url('/fonts/archivo-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Archivo'; font-weight: 800; font-display: block; src: url('/fonts/archivo-latin-800-normal.woff2') format('woff2'); }
      #splash {
        --bg: #201e1d; --fg: #f3f2f2;
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: var(--bg); color: var(--fg);
        font-family: 'Archivo', Helvetica, Arial, sans-serif;
        transition: opacity 250ms;
      }
      [data-theme='light'] #splash { --bg: #f3f2f2; --fg: #201e1d; }
      #splash.is-hidden { opacity: 0; }
      .splash-logo { display: flex; flex-direction: column; align-items: flex-start; gap: 28px; }
      .splash-mark { position: relative; width: 120px; height: 120px; }
      .splash-mark i { position: absolute; width: 36px; height: 36px; animation: lz-piece 2.4s ease-in-out infinite; }
      .splash-mark i:nth-child(1) { left: 0; top: 0; background: #9a55e0; }
      .splash-mark i:nth-child(2) { left: 0; top: 42px; background: #2f78e4; animation-delay: .12s; }
      .splash-mark i:nth-child(3) { left: 0; top: 84px; background: #1f9e52; animation-delay: .24s; }
      .splash-mark i:nth-child(4) { left: 42px; top: 84px; background: #f29d12; animation-delay: .36s; }
      .splash-mark i:nth-child(5) { left: 84px; top: 84px; background: #ec3013; animation-delay: .48s; }
      .splash-mark i:nth-child(6) { left: 89px; top: 5px; width: 26px; height: 26px; background: var(--fg); transform: rotate(45deg); animation-name: lz-diamond; animation-delay: .64s; }
      .splash-word { display: flex; flex-direction: column; gap: 10px; }
      .splash-word b { font-weight: 800; font-size: 44px; line-height: .9; letter-spacing: -.02em; }
      .splash-word span { font-weight: 600; font-size: 13px; letter-spacing: .62em; }
      @keyframes lz-piece { 0% { opacity: .12; transform: scale(.82) } 12%, 72% { opacity: 1; transform: scale(1) } 90%, 100% { opacity: .12; transform: scale(.82) } }
      @keyframes lz-diamond { 0% { opacity: .12; transform: rotate(45deg) scale(.6) } 12%, 72% { opacity: 1; transform: rotate(45deg) scale(1) } 90%, 100% { opacity: .12; transform: rotate(45deg) scale(.6) } }
      @media (prefers-reduced-motion: reduce) { .splash-mark i { animation: none; } }
    </style>
  </head>

    <div id="splash" role="img" aria-label="Cargando Luzaron Games">
      <div class="splash-logo">
        <div class="splash-mark"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="splash-word"><b>Luzaron</b><span>GAMES</span></div>
      </div>
    </div>
